<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" role="img" aria-labelledby="t d">
  <title id="t">sql-mq-worker banner</title>
  <desc id="d">Your SQL table, but it is a message queue.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#10312d"/>
      <stop offset="1" stop-color="#0c1b2a"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f6d365"/>
      <stop offset="1" stop-color="#c98a1b"/>
    </linearGradient>
  </defs>
  <style>
    .name { font: 700 64px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #f4f1ea; }
    .promise { font: 400 22px Georgia, 'Times New Roman', serif; fill: #d9d4c7; }
    .era { font: 600 15px ui-monospace, Menlo, Consolas, monospace; fill: #7fd1b9; letter-spacing: 3px; }
    .drift { animation: drift 10s ease-in-out infinite alternate; }
    .pulse { animation: pulse 8s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    @keyframes drift { from { transform: translateX(0); } to { transform: translateX(-24px); } }
    @keyframes pulse { 0%,100% { opacity: .35; } 50% { opacity: .9; } }
    @media (prefers-reduced-motion: reduce) { .drift, .pulse { animation: none; } }
  </style>
  <rect width="1200" height="300" rx="24" fill="url(#bg)"/>
  <rect x="1" y="1" width="1198" height="298" rx="23" fill="none" stroke="#7fd1b9" stroke-opacity=".35" stroke-width="2"/>
