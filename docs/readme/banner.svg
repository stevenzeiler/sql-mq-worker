    <text x="1070" y="117" font-family="ui-monospace,Menlo,monospace" font-size="13" fill="#d9d4c7">sent</text></g>
    <g class="pulse" style="animation-delay:2.6s"><rect x="820" y="138" width="300" height="28" rx="6" fill="#ffffff" fill-opacity=".08" stroke="#7fd1b9" stroke-opacity=".6"/>
    <circle cx="840" cy="152" r="5" fill="#f6d365"/><rect x="858" y="148" width="224" height="8" rx="4" fill="#ffffff" fill-opacity=".35"/>
    <text x="1070" y="157" font-family="ui-monospace,Menlo,monospace" font-size="13" fill="#d9d4c7">toSend</text></g>
    <g class="pulse" style="animation-delay:3.9000000000000004s"><rect x="820" y="178" width="300" height="28" rx="6" fill="#ffffff" fill-opacity=".08" stroke="#7fd1b9" stroke-opacity=".6"/>
    <circle cx="840" cy="192" r="5" fill="#7fd1b9"/><rect x="858" y="188" width="171" height="8" rx="4" fill="#ffffff" fill-opacity=".35"/>
    <text x="1070" y="197" font-family="ui-monospace,Menlo,monospace" font-size="13" fill="#d9d4c7">toSend</text></g>
    <g class="pulse" style="animation-delay:5.2s"><rect x="820" y="218" width="300" height="28" rx="6" fill="#ffffff" fill-opacity=".08" stroke="#7fd1b9" stroke-opacity=".6"/>
    <circle cx="840" cy="232" r="5" fill="#7fd1b9"/><rect x="858" y="228" width="208" height="8" rx="4" fill="#ffffff" fill-opacity=".35"/>
    <text x="1070" y="237" font-family="ui-monospace,Menlo,monospace" font-size="13" fill="#d9d4c7">toSend</text></g>
